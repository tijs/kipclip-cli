[package]
name = "kipclip"
version = "0.1.0"
edition = "2024"
description = "CLI for kipclip.com – AT Protocol bookmark manager"
license = "MIT"
repository = "https://github.com/tijs/kipclip-cli"

[[bin]]
name = "kip"
path = "src/main.rs"

[dependencies]
jacquard = "0.9"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
open = "5"
owo-colors = "4"
chrono = { version = "0.4", features = ["serde"] }
miette = { version = "7", features = ["fancy"] }
dirs = "6"
unicode-width = "0.2"
terminal_size = "0.4"
jacquard-identity = "0.9"
